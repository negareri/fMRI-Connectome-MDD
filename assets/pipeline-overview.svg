<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">fMRI Connectome MDD pipeline overview</title>
  <desc id="desc">A four-step workflow from OpenNeuro fMRIPrep data through ROI time-series, connectivity features, and classifier comparison.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#F6FAFD"/><stop offset="1" stop-color="#EEF3FA"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183B56" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <text x="60" y="64" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#12344D">From resting-state fMRI to exploratory MDD classification</text>
  <text x="60" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#597282">A reproducible four-notebook workflow</text>
  <path d="M276 234H321M552 234H597M828 234H873" stroke="#77A6C5" stroke-width="4" stroke-linecap="round"/>
  <path d="M321 234L311 227V241L321 234ZM597 234L587 227V241L597 234ZM873 234L863 227V241L873 234Z" fill="#77A6C5"/>
  <g filter="url(#shadow)">
    <rect x="60" y="140" width="216" height="188" rx="18" fill="white"/>
    <rect x="60" y="140" width="216" height="9" rx="4.5" fill="#2E86AB"/>
    <circle cx="100" cy="191" r="21" fill="#E5F3F9"/><path d="M89 191h22M100 180v22" stroke="#2E86AB" stroke-width="3" stroke-linecap="round"/>
    <text x="132" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12344D">01 · PREPARE</text>
    <text x="84" y="239" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12344D">OpenNeuro derivatives</text>
    <text x="84" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#597282">fMRIPrep BOLD + confounds</text>
    <text x="84" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#597282">72 participants</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="336" y="140" width="216" height="188" rx="18" fill="white"/>
    <rect x="336" y="140" width="216" height="9" rx="4.5" fill="#39A96B"/>
    <circle cx="376" cy="191" r="21" fill="#E7F6ED"/><path d="M365 197c8-20 14 8 22-12" stroke="#39A96B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text x="408" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12344D">02 · EXTRACT</text>
    <text x="360" y="239" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12344D">AAL3 ROI signals</text>
    <text x="360" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#597282">Denoise · filter · standardize</text>
    <text x="360" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#597282">166 regions</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="612" y="140" width="216" height="188" rx="18" fill="white"/>
    <rect x="612" y="140" width="216" height="9" rx="4.5" fill="#8B5FBF"/>
    <circle cx="652" cy="191" r="21" fill="#F0E9F8"/><rect x="641" y="180" width="7" height="7" fill="#8B5FBF"/><rect x="652" y="180" width="7" height="7" fill="#C4A6E3"/><rect x="663" y="180" width="7" height="7" fill="#8B5FBF"/><rect x="641" y="191" width="7" height="7" fill="#C4A6E3"/><rect x="652" y="191" width="7" height="7" fill="#8B5FBF"/><rect x="663" y="191" width="7" height="7" fill="#C4A6E3"/>
    <text x="684" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12344D">03 · CONNECT</text>
    <text x="636" y="239" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12344D">Static connectomes</text>
    <text x="636" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#597282">Pearson + partial correlation</text>
    <text x="636" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#597282">13,695 edges / participant</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="888" y="140" width="252" height="188" rx="18" fill="white"/>
    <rect x="888" y="140" width="252" height="9" rx="4.5" fill="#E27D3F"/>
    <circle cx="928" cy="191" r="21" fill="#FBECE2"/><path d="M917 202l8-9 7 5 10-15" stroke="#E27D3F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="960" y="186" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12344D">04 · COMPARE</text>
    <text x="912" y="239" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#12344D">ML pipelines</text>
    <text x="912" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#597282">ANOVA · LASSO · PCA</text>
    <text x="912" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#597282">SVM · KNN · Random Forest</text>
  </g>
  <text x="60" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#597282">Primary comparison metric: balanced accuracy · Research use only; not a clinical decision tool</text>
</svg>